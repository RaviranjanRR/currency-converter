<head>
<meta charset="UTF-8">

<title>World Currency Converter</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
}

.card{
    width:100%;
    max-width:550px;
    background:white;
    padding:28px;
    border-radius:24px;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
}

h1{
    text-align:center;
    margin-bottom:8px;
    color:#111827;
}

.subtitle{
    text-align:center;
    color:#6b7280;
    margin-bottom:25px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:8px;
    color:#374151;
}

input,select{
    width:100%;
    padding:14px;
    border:2px solid #e5e7eb;
    border-radius:12px;
    font-size:16px;
    outline:none;
    background:white;
}

input:focus,select:focus{
    border-color:#4f46e5;
}

.box{
    margin-bottom:20px;
}

.currency{
    display:grid;
    grid-template-columns:1fr 50px 1fr;
    gap:10px;
    align-items:center;
}

.swap{
    width:50px;
    height:50px;
    border:0;
    border-radius:50%;
    background:#4f46e5;
    color:white;
    font-size:24px;
    cursor:pointer;
}

.swap:hover{
    background:#3730a3;
}

.convert{
    width:100%;
    padding:15px;
    border:0;
    border-radius:12px;
    background:#111827;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.convert:hover{
    background:#000;
}

.result{
    margin-top:22px;
    padding:22px;
    text-align:center;
    background:#f3f4f6;
    border-radius:15px;
}

.result small{
    color:#6b7280;
}

#result{
    margin-top:8px;
    font-size:30px;
    font-weight:bold;
    color:#4f46e5;
}

#rate{
    margin-top:10px;
    color:#4b5563;
}

.footer{
    text-align:center;
    margin-top:18px;
    font-size:13px;
    color:#9ca3af;
}

@media(max-width:500px){
    .card{
        padding:20px;
    }

    .currency{
        grid-template-columns:1fr;
    }

    .swap{
        margin:auto;
        transform:rotate(90deg);
    }
}
</style>
</head>

150+ Countries Currency Converter
</p>

<div class="currency">

<select id="from"></select>

<button class="swap" onclick="swap()">⇄</button>

<select id="to"></select>

</div>

<button class="convert" onclick="convert()">

<div class="result">

const from = document.getElementById("from");
const to = document.getElementById("to");


countries.forEach(function(country){

    let option1 = document.createElement("option");

    option1.value = country[2];

    option1.textContent =
        country[0] + " " +
        country[1] + " (" +
        country[2] + ")";

    from.appendChild(option1);


    let option2 = document.createElement("option");

    option2.value = country[2];

    option2.textContent =
        country[0] + " " +
        country[1] + " (" +
        country[2] + ")";

    to.appendChild(option2);

});


from.value = "USD";
to.value = "INR";


async function convert(){

    const amount =
        parseFloat(
            document.getElementById("amount").value
        );

    const fromCode = from.value;
    const toCode = to.value;

    const result =
        document.getElementById("result");

    const rate =
        document.getElementById("rate");


    if(isNaN(amount) || amount < 0){

        result.innerHTML = "Enter valid amount";
        rate.innerHTML = "";

        return;
    }


    result.innerHTML = "⏳ Loading...";
    rate.innerHTML = "Getting latest rate...";


    try{

        const response =
            await fetch(
                "https://open.er-api.com/v6/latest/"
                + fromCode
            );


        const data =
            await response.json();


        if(data.result !== "success"){

            throw new Error("API Error");

        }


        const exchangeRate =
            data.rates[toCode];


        const converted =
            amount * exchangeRate;


        result.innerHTML =
            converted.toLocaleString(
                undefined,
                {
                    maximumFractionDigits:2
                }
            )
            + " " + toCode;


        rate.innerHTML =
            "1 " + fromCode +
            " = " +
            exchangeRate.toFixed(4) +
            " " + toCode;

    }

    catch(error){

        result.innerHTML =
            "❌ Error";

        rate.innerHTML =
            "Internet connection check karein.";

    }

}


function swap(){

    const temp = from.value;

    from.value = to.value;

    to.value = temp;

    convert();

}
